name: fogo
description: "F.O.G.O. — Plataforma de inteligência e controle urbano (desktop)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  latlong2: ^0.10.1

  # F.O.G.O. 3D Engine: renderização 3D (Flutter GPU/Impeller).
  flutter_scene: ^0.24.3
  # Matemática de vetores/matriz do motor (já transitiva do Flutter; uso
  # direto no motor puro em lib/engine/).
  vector_math: ^2.1.4
  # Parsing XML (arquivos .osm) — streaming de eventos, sem DOM em memória.
  xml: ^6.5.0
  # Diálogo nativo de seleção de arquivo .osm (Windows/Linux/macOS).
  file_selector: ^1.0.3

  # Estado (MVVM) e navegação.
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0

  # Janela desktop frameless: title bar nativa oculta; o app tem titlebar
  # própria (mesmo padrão do projeto LienneDart).
  window_manager: ^0.5.2

  # Iconografia Lucide.
  flutter_lucide: ^1.59.0
  http: ^1.6.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Nenhum widget/ícone Material é usado na UI (WidgetsApp + Lucide).
  # A flag apenas inclui o font de ícones exigido pela tooling quando uma
  # dependência (flutter_lucide) a declara; não torna a UI Material.
  uses-material-design: true

  # Base cartográfica real: extratos OSM XML das cidades do catálogo
  # regional (tool/map_data/extract_osm_xml.py) + células 2D legadas.
  assets:
    - assets/map/manifest.json
    - assets/map/cells/
    - assets/map/osm/
